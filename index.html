*{
  box-sizing:border-box;
}
body{
  margin:0;

}

#welcomeScreen{
    min-height:90vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    max-width:600px;
    margin:auto;
}

#councilScreen,

.header{
  background:white;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
  box-shadow:0 2px 5px rgba(0,0,0,.1);
}

h1{
  margin-top:0;
  font-size:24px;
}

input{
  width:100%;
  padding:12px;
  font-size:16px;
  border:1px solid #ccc;
  border-radius:8px;
}

.counter{
  margin-top:10px;
  font-size:18px;
  font-weight:bold;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:15px;
}

.card{
  background:white;
  padding:15px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

.card img{
  width:110px;
  height:110px;
  border-radius:50%;
  object-fit:cover;
}

.name{
  margin-top:12px;
  font-weight:600;
  min-height:48px;
}

button{
  cursor:pointer;
}

.selectBtn{
  margin-top:12px;
  background:#0078d4;
  color:white;
  border:none;
  padding:10px 15px;
  border-radius:8px;
}

.selected{
  background:#28a745 !important;
}

.submitBtn{
  display:none;
  margin-top:15px;
  background:#28a745;
  color:white;
  border:none;
  padding:14px 20px;
  border-radius:8px;
  width:100%;
  font-size:18px;
}
.spinner {
    display:inline-block;
    width:16px;
    height:16px;
    border:3px solid rgba(255,255,255,.3);
    border-radius:50%;
    border-top-color:white;
    animation:spin 1s linear infinite;
    margin-right:8px;
    vertical-align:middle;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}
</style>

    <button

</div>

<div id="auditorScreen" style="display:none">

const auditorNominees =
    councilNominees.map(person => ({
        personID: "AUD" + person.personID,
        name: person.name,
        avatar: person.avatar
    }));

const allNominees =
[
    ...councilNominees,
    ...auditorNominees
];
const councilMembers = councilNominees;

const auditors = auditorNominees;

let selectedCouncil = [];
let selectedAuditor = [];
let filteredAuditors = [];
let votingCode = "";

async function startElection(){

    const code =
        document.getElementById(
            "voteCode"
        ).value.trim().toUpperCase();

    const pattern =
        /^[A-Z]{4}[5-9][0-9]{3}$/;

    if(!pattern.test(code)){

        showMessage(
            "Invalid Voting Code",
            "Please enter a valid voting code."
        );

        return;
    }

    try{

        const response =
            await fetch(
                VALIDATE_FLOW_URL,
                {
                    method:'POST',
                    headers:{
                        'Content-Type':'application/json'
                    },
                    body:JSON.stringify({
                        votingCode: code
                    })
                }
            );

        const result =
            await response.json();

        if(!result.success){

            if(
                result.message &&
                result.message.toLowerCase().includes(
                    "already voted"
                )
            ){

                showMessage(
                    "Vote Already Recorded",
                    result.message
                );
            }
            else{

                showMessage(
                    "Invalid Voting Code",
                    result.message
                );
            }

            return;
        }

        votingCode = code;

        document.getElementById(
            "welcomeScreen"
        ).style.display = "none";

        document.getElementById(
            "councilScreen"
        ).style.display = "block";

        renderCouncilMembers();

    }
    catch(ex){

        console.error(ex);

        showMessage(
            "Validation Error",
            "Unable to validate the voting code."
        );
    }
}
function renderGallery()
{
    renderCouncilMembers();
    renderAuditors();
}

function renderCouncilMembers(){

    const gallery =
        document.getElementById(
            "councilGallery"
        );

    gallery.innerHTML = "";

    document.getElementById(
        "councilCounter"
    ).innerHTML =
        `Selected ${selectedCouncil.length} of 5`;

    councilMembers.forEach(person => {

        gallery.innerHTML += `
        <div class="card">

            <img
                src="${person.avatar}"
                alt="${person.name}">

            <div class="name">
                ${person.name}
            </div>

            <button
                class="selectBtn"
                id="council-${person.personID}"
                onclick="toggleCouncil('${person.personID}')">

                Select

            </button>

        </div>
        `;
    });
}
function renderAuditors(){

    const gallery =
        document.getElementById(
            "auditorGallery"
        );

    auditors.forEach(person => {

        gallery.innerHTML += `

    <div class="card">
    
        <img
            src="${person.avatar}"
            alt="${person.name}">
    
        <div class="name">
            ${person.name}
        </div>

            <button
                class="selectBtn"
                id="auditor-${person.personID}"
                onclick="toggleAuditor('${person.personID}')">

                Select

            </button>

        </div>
        `;
    });
}

  function toggleCouncil(personID){

    const button =
        document.getElementById(
            `council-${personID}`
        );

    const index =
        selectedCouncil.indexOf(
            personID
        );

    if(index > -1){

        selectedCouncil.splice(
            index,
            1
        );

        button.textContent =
            "Select";

        button.classList.remove(
            "selected"
        );
    }
    else{

        if(
            selectedCouncil.length >= 5
        ){

            alert(
                "You may select only 5 council members."
            );

            return;
        }

        selectedCouncil.push(
            personID
        );

        button.textContent =
            "Selected";

        button.classList.add(
            "selected"
        );
    }

   updateCouncilCounter();
}
function renderFilteredAuditors(){

    const gallery =
        document.getElementById(
            "auditorGallery"
        );

    gallery.innerHTML = "";

    filteredAuditors.forEach(person => {

        gallery.innerHTML += `
        <div class="card">

            <img
               src="${person.avatar}"
               alt="${person.name}">

            <div class="name">
                ${person.name}
            </div>

            <button
                class="selectBtn"
                id="auditor-${person.personID}"
                onclick="toggleAuditor('${person.personID}')">

                Select

            </button>

        </div>
        `;
    });
}
    
function submitCouncilSelection(){

    if(selectedCouncil.length !== 5){

        alert(
            "Please select 5 council members."
        );

        return;
    }

    filteredAuditors =
        auditorNominees.filter(a =>

            !selectedCouncil.includes(
                String(a.personID)
                    .replace("AUD","")
            )
        );

    document.getElementById(
        "councilScreen"
    ).style.display = "none";

    document.getElementById(
        "auditorScreen"
    ).style.display = "block";

    renderFilteredAuditors();
}
  
  function toggleAuditor(personID){

    selectedAuditor = [personID];

  filteredAuditors.forEach(a => {

        const btn =
            document.getElementById(
                `auditor-${a.personID}`
            );

        btn.textContent =
            "Select";

        btn.classList.remove(
            "selected"
        );
    });

    const button =
        document.getElementById(
            `auditor-${personID}`
        );

    button.textContent =
        "Selected";

    button.classList.add(
        "selected"
    );

    updateAuditorCounter();
}
  
function updateCouncilCounter(){

    document.getElementById(
        "councilCounter"
    ).innerHTML =
    `Selected ${selectedCouncil.length} of 5`;

    document.getElementById(
        "councilSubmitBtn"
    ).style.display =
    selectedCouncil.length === 5
    ? "block"
    : "none";
}

function updateAuditorCounter(){

    document.getElementById(
        "auditorCounter"
    ).innerHTML =
    `Selected ${selectedAuditor.length} of 1`;

    document.getElementById(
        "submitBtn"
    ).style.display =
    selectedAuditor.length === 1
    ? "block"
    : "none";
}

             style="

                inset:0;
                background:rgba(0,0,0,.45);

                box-shadow:0 12px 40px rgba(0,0,0,.25);
             ">

                <div style="
                    font-size:40px;

                ">
                    🙏
                </div>

                <div style="

                    color:#6b5700;
                    margin-bottom:15px;
                ">
                    ${title}
                </div>

                <div style="
                    font-size:16px;
                    line-height:1.6;
                    color:#333;
                ">
                    ${message}
                </div>

                <button
                    onclick="document.getElementById('churchPopup').remove()"
                    style="
                        margin-top:24px;
                        width:100%;
                        background:#2e7d32;
                        color:white;
                        border:none;
                        border-radius:10px;
                        padding:14px;
                        font-size:16px;
                        font-weight:600;
                        cursor:pointer;
                    ">
                    OK
                </button>

            </div>

        </div>
        `
    );
}
async function submitVotes(){

    const submitBtn =
        document.getElementById(
            "submitBtn"
        );

const voteCode = votingCode;

    // Validate first BEFORE showing spinner

if(votingCode === ""){

    showMessage(
        "Voting Code Required",
        "Please enter the code you received from the ushers before submitting your selections."
    );

    return;
}

    if(selectedCouncil.length !== 5){

        alert(
            "Please select 5 council members."
        );

        return;
    }

    if(selectedAuditor.length !== 1){

        alert(
            "Please select 1 auditor."
        );

        return;
    }

    // Start loading only after validations pass

    document.getElementById(
        "loadingOverlay"
    ).style.display = "block";

    submitBtn.disabled = true;

    submitBtn.innerHTML =
    `
    <span class="spinner"></span>
    Recording your vote...
    `;


const votes = allNominees
    .filter(n =>

        selectedCouncil.includes(
            String(n.personID)
        )

        ||

        selectedAuditor.includes(
            String(n.personID)
        )

    )
    .map(n => ({
        personID:n.personID,
        personName:n.name
    }));


const payload = {
    votingCode: voteCode,
    votes: votes
};

    try{

        const response =
            await fetch(
                FLOW_URL,
                {
                    method:'POST',
                    headers:{
                        'Content-Type':
                        'application/json'
                    },
                    body:
                    JSON.stringify(payload)
                }
            );

        const result =
            await response.json();

        if(result.success){

            document.body.innerHTML = `
                <div style="
                    text-align:center;
                    margin-top:100px;
                ">
                    <h1>✅ Thank You!</h1>

                    <p>
                    Your selections have been received and securely recorded.
                    Thank you for participating prayerfully in this process.
                    </p>
                </div>
            `;
        }
        else{

            document.getElementById(
                "loadingOverlay"
            ).style.display = "none";

            submitBtn.disabled = false;

            submitBtn.innerHTML =
                "Submit Choices";

if(
    result.message &&
    result.message.includes(
        "already voted"
    )
){

                showMessage(
                    "Vote Already Recorded",
                    result.message
                );
            }
            else{
            
                showMessage(
                    "Invalid Voting Code",
                    result.message ||
                    "The voting code entered is not valid. Please check the code and try again."
                );
            }
        }

    }
    catch(ex){

        document.getElementById(
            "loadingOverlay"
        ).style.display = "none";

        submitBtn.disabled = false;

        submitBtn.innerHTML =
            "Submit Choices";

        alert(
            "Unable to submit vote. Please try again."
        );

        console.error(ex);
    }
}

</script>
