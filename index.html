let selectedPeople = [];

renderGallery();

function renderGallery(){

 const gallery =
 document.getElementById("gallery");

 nominees.forEach(person => {

   gallery.innerHTML += `

   <div class="card">

      <img
       src="${person.avatar}"
       alt="${person.name}">

      <div class="name">

        ${person.name}

      </div>

      <button
       class="selectBtn"
       id="btn-${person.personID}"
       onclick="togglePerson(${person.personID})">

       Select

      </button>

   </div>

   `;

 });

}

function togglePerson(personID){

 const button =
 document.getElementById(
 `btn-${personID}`
 );

 const index =
 selectedPeople.indexOf(personID);

 if(index > -1){

    selectedPeople.splice(index,1);

    button.textContent = 'Select';

    button.classList.remove('selected');

 }
 else{

    if(selectedPeople.length >= 5){

       alert(
       'You may only select five people.'
       );

       return;
    }

    selectedPeople.push(personID);

    button.textContent = 'Selected';

    button.classList.add('selected');
 }

 updateCounter();

}

function updateCounter(){

 const count =
 selectedPeople.length;

 document.getElementById(
 "counter"
 ).textContent =
 `Selected: ${count} of 5`;

 document.getElementById(
 "submitBtn"
 ).style.display =
 count===5
 ? "block"
 : "none";

}

async function submitVotes(){

 const votingCode =
 document.getElementById(
 'voteCode'
 ).value.trim();

 if(votingCode===""){

   alert(
   "Please enter a voting code."
   );

   return;
 }

 const votes =
 nominees
 .filter(n =>
     selectedPeople.includes(
     n.personID
     )
 )
 .map(n => ({
     personID:n.personID,
     personName:n.name
 }));

 const payload = {

     votingCode:votingCode,

     votes:votes

 };

 try{

     const response =
     await fetch(
       FLOW_URL,
       {
          method:'POST',

          headers:{
             'Content-Type':
             'application/json'
          },

          body:
          JSON.stringify(payload)
       }
     );

     const result =
     await response.json();

     if(result.success){

         alert(
         "Thank you for voting!"
         );

        document.body.innerHTML = `
        <div style="
        text-align:center;
        margin-top:100px;
        ">
        <h1>✅ Thank You!</h1>
         
        <p>
        Your vote has been recorded.
        </p>
        </div>
        `

     }
     else{

         alert(
         result.message
         );
     }

 }
 catch(ex){

     alert(
     "Unable to submit vote."
     );

     console.error(ex);

 }

}
