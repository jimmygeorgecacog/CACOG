const councilMembers =
nominees.filter(
x => !String(x.personID).startsWith("AUD")
);
 
const auditors =
nominees.filter(
x => String(x.personID).startsWith("AUD")
);
let selectedCouncil = [];
let selectedAuditor = [];

renderGallery();

function renderGallery()
{
    renderCouncilMembers();
    renderAuditors();
}

function renderCouncilMembers(){

    const gallery =
        document.getElementById(
            "councilGallery"
        );

    councilMembers.forEach(person => {

        gallery.innerHTML += `

          <div class="card">
          
              <img
                  src="${person.avatar}"
                  alt="${person.name}">
          
              <div class="name">
                  ${person.name}
              </div>

            <button
                class="selectBtn"
                id="council-${person.personID}"
                onclick="toggleCouncil('${person.personID}')">

                Select

            </button>

        </div>
        `;
    });
}
function renderAuditors(){

    const gallery =
        document.getElementById(
            "auditorGallery"
        );

    auditors.forEach(person => {

        gallery.innerHTML += `

    <div class="card">
    
        <img
            src="${person.avatar}"
            alt="${person.name}">
    
        <div class="name">
            ${person.name}
        </div>

            <button
                class="selectBtn"
                id="auditor-${person.personID}"
                onclick="toggleAuditor('${person.personID}')">

                Select

            </button>

        </div>
        `;
    });
}

  function toggleCouncil(personID){

    const button =
        document.getElementById(
            `council-${personID}`
        );

    const index =
        selectedCouncil.indexOf(
            personID
        );

    if(index > -1){

        selectedCouncil.splice(
            index,
            1
        );

        button.textContent =
            "Select";

        button.classList.remove(
            "selected"
        );
    }
    else{

        if(
            selectedCouncil.length >= 5
        ){

            alert(
                "You may select only 5 council members."
            );

            return;
        }

        selectedCouncil.push(
            personID
        );

        button.textContent =
            "Selected";

        button.classList.add(
            "selected"
        );
    }

    updateCounter();
}

  function toggleAuditor(personID){

    selectedAuditor = [personID];

    auditors.forEach(a => {

        const btn =
            document.getElementById(
                `auditor-${a.personID}`
            );

        btn.textContent =
            "Select";

        btn.classList.remove(
            "selected"
        );
    });

    const button =
        document.getElementById(
            `auditor-${personID}`
        );

    button.textContent =
        "Selected";

    button.classList.add(
        "selected"
    );

    updateCounter();
}
  
  const index =
 selectedPeople.indexOf(personID);

 if(index > -1){

    selectedPeople.splice(index,1);

 }
 else{

    if(selectedPeople.length >= 5){

    button.classList.add('selected');
 }

}

function updateCounter(){

    document.getElementById(
        "counter"
    ).innerHTML =

    `Council: ${selectedCouncil.length}/5
     | Auditor: ${selectedAuditor.length}/1`;

    document.getElementById(
        "submitBtn"
    ).style.display =

    selectedCouncil.length === 5 &&
    selectedAuditor.length === 1

    ? "block"
    : "none";
}

async function submitVotes(){
  
  const votingCode =
 document.getElementById(
 'voteCode'
 ).value.trim();
  
  document.getElementById(
   "submitBtn"
).disabled = true;
  
   if(votingCode===""){

   alert(
   "Please enter a voting code."
   );
     
if(
    selectedCouncil.length !== 5
){

    alert(
        "Please select 5 council members."
    );

    return;
}
  if(
    selectedAuditor.length !== 1
){

    alert(
        "Please select 1 auditor."
    );

    return;
}




   return;
 }

 const votes = nominees
.filter(n =>

    selectedCouncil.includes(
        String(n.personID)
    )

    ||

    selectedAuditor.includes(
        String(n.personID)
    )
)
.map(n => ({
    personID:n.personID,
    personName:n.name
}));

 const payload = {

     votingCode:votingCode,

     votes:votes

 };

 try{

     const response =
     await fetch(
       FLOW_URL,
       {
          method:'POST',

          headers:{
             'Content-Type':
             'application/json'
          },

          body:
          JSON.stringify(payload)
       }
     );

     const result =
     await response.json();

     if(result.success){

         alert(
         "Thank you for voting!"
         );

        document.body.innerHTML = `
        <div style="
        text-align:center;
        margin-top:100px;
        ">
        <h1>✅ Thank You!</h1>
         
        <p>
        Your selections have been received and securely recorded.
        Thank you for participating prayerfully in this process.
        </p>
        </div>
        `

     }
     else{

      alert(
         result.message ||
         "The voting code is invalid or an unexpected error occurred."
      );
     }

 }
 catch(ex){

     alert(
     "Unable to submit vote."
     );

   document.getElementById(
   "submitBtn"
  ).disabled = false;
   
     console.error(ex);

 }

}
