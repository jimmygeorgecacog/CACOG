const councilMembers =
nominees.filter(
x => !String(x.personID).startsWith("AUD")
);
 
const auditors =
nominees.filter(
x => String(x.personID).startsWith("AUD")
);
let selectedCouncil = [];
let selectedAuditor = [];

renderGallery();

function renderGallery()
{
    renderCouncilMembers();
    renderAuditors();
}

function renderCouncilMembers(){

    const gallery =
        document.getElementById(
            "councilGallery"
        );

    councilMembers.forEach(person => {

        gallery.innerHTML += `

          <div class="card">
          
              <img
                  src="${person.avatar}"
                  alt="${person.name}">
          
              <div class="name">
                  ${person.name}
              </div>

            <button
                class="selectBtn"
                id="council-${person.personID}"
                onclick="toggleCouncil('${person.personID}')">

                Select

            </button>

        </div>
        `;
    });
}
function renderAuditors(){

    const gallery =
        document.getElementById(
            "auditorGallery"
        );

    auditors.forEach(person => {

        gallery.innerHTML += `

    <div class="card">
    
        <img
            src="${person.avatar}"
            alt="${person.name}">
    
        <div class="name">
            ${person.name}
        </div>

            <button
                class="selectBtn"
                id="auditor-${person.personID}"
                onclick="toggleAuditor('${person.personID}')">

                Select

            </button>

        </div>
        `;
    });
}

  function toggleCouncil(personID){

    const button =
        document.getElementById(
            `council-${personID}`
        );

    const index =
        selectedCouncil.indexOf(
            personID
        );

    if(index > -1){

        selectedCouncil.splice(
            index,
            1
        );

        button.textContent =
            "Select";

        button.classList.remove(
            "selected"
        );
    }
    else{

        if(
            selectedCouncil.length >= 5
        ){

            alert(
                "You may select only 5 council members."
            );

            return;
        }

        selectedCouncil.push(
            personID
        );

        button.textContent =
            "Selected";

        button.classList.add(
            "selected"
        );
    }

    updateCounter();
}

  function toggleAuditor(personID){

    selectedAuditor = [personID];

    auditors.forEach(a => {

        const btn =
            document.getElementById(
                `auditor-${a.personID}`
            );

        btn.textContent =
            "Select";

        btn.classList.remove(
            "selected"
        );
    });

    const button =
        document.getElementById(
            `auditor-${personID}`
        );

    button.textContent =
        "Selected";

    button.classList.add(
        "selected"
    );

    updateCounter();
}
  
function updateCounter(){

    document.getElementById(
        "counter"
    ).innerHTML =

    `Council: ${selectedCouncil.length}/5
     | Auditor: ${selectedAuditor.length}/1`;

    document.getElementById(
        "submitBtn"
    ).style.display =

    selectedCouncil.length === 5 &&
    selectedAuditor.length === 1

    ? "block"
    : "none";
}

function showMessage(title, message){

    document.body.insertAdjacentHTML(
        "beforeend",
        `
        <div id="churchPopup"
             style="
                position:fixed;
                inset:0;
                background:rgba(0,0,0,.45);
                display:flex;
                align-items:center;
                justify-content:center;
                padding:20px;
                z-index:9999;
             ">

            <div style="
                background:white;
                border:3px solid #d4af37;
                border-radius:18px;
                padding:24px;
                width:100%;
                max-width:420px;
                text-align:center;
                box-shadow:0 12px 40px rgba(0,0,0,.25);
             ">

                <div style="
                    font-size:40px;
                    margin-bottom:10px;
                ">
                    🙏
                </div>

                <div style="
                    font-size:22px;
                    font-weight:700;
                    color:#6b5700;
                    margin-bottom:15px;
                ">
                    ${title}
                </div>

                <div style="
                    font-size:16px;
                    line-height:1.6;
                    color:#333;
                ">
                    ${message}
                </div>

                <button
                    onclick="document.getElementById('churchPopup').remove()"
                    style="
                        margin-top:24px;
                        width:100%;
                        background:#2e7d32;
                        color:white;
                        border:none;
                        border-radius:10px;
                        padding:14px;
                        font-size:16px;
                        font-weight:600;
                        cursor:pointer;
                    ">
                    OK
                </button>

            </div>

        </div>
        `
    );
}
async function submitVotes(){

    const submitBtn =
        document.getElementById(
            "submitBtn"
        );

    const votingCode =
        document.getElementById(
            "voteCode"
        ).value.trim();

    // Validate first BEFORE showing spinner

    if(votingCode === ""){

        alert(
            "Please enter a voting code."
        );

        return;
    }

    if(selectedCouncil.length !== 5){

        alert(
            "Please select 5 council members."
        );

        return;
    }

    if(selectedAuditor.length !== 1){

        alert(
            "Please select 1 auditor."
        );

        return;
    }

    // Start loading only after validations pass

    document.getElementById(
        "loadingOverlay"
    ).style.display = "block";

    submitBtn.disabled = true;

    submitBtn.innerHTML =
    `
    <span class="spinner"></span>
    Recording your vote...
    `;

    const votes = nominees
        .filter(n =>

            selectedCouncil.includes(
                String(n.personID)
            )

            ||

            selectedAuditor.includes(
                String(n.personID)
            )

        )
        .map(n => ({
            personID:n.personID,
            personName:n.name
        }));

    const payload = {

        votingCode:votingCode,

        votes:votes

    };

    try{

        const response =
            await fetch(
                FLOW_URL,
                {
                    method:'POST',
                    headers:{
                        'Content-Type':
                        'application/json'
                    },
                    body:
                    JSON.stringify(payload)
                }
            );

        const result =
            await response.json();

        if(result.success){

            document.body.innerHTML = `
                <div style="
                    text-align:center;
                    margin-top:100px;
                ">
                    <h1>✅ Thank You!</h1>

                    <p>
                    Your selections have been received and securely recorded.
                    Thank you for participating prayerfully in this process.
                    </p>
                </div>
            `;
        }
        else{

            document.getElementById(
                "loadingOverlay"
            ).style.display = "none";

            submitBtn.disabled = false;

            submitBtn.innerHTML =
                "Submit Choices";

if(
    result.message &&
    result.message.includes(
        "already voted"
    )
){

                showMessage(
                    "Vote Already Recorded",
                    result.message
                );
            }
            else{
            
                showMessage(
                    "Invalid Voting Code",
                    result.message ||
                    "The voting code entered is not valid. Please check the code and try again."
                );
            }
        }

    }
    catch(ex){

        document.getElementById(
            "loadingOverlay"
        ).style.display = "none";

        submitBtn.disabled = false;

        submitBtn.innerHTML =
            "Submit Choices";

        alert(
            "Unable to submit vote. Please try again."
        );

        console.error(ex);
    }
}
